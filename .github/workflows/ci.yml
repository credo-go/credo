name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOLANGCI_X_TOOLS_VERSION: "v0.48.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  test-sqldb:
    name: Test (store/sqldb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create in-tree module workspace
        run: go run ./scripts/releasegate workspace

      - name: Run submodule tests (including Bun compatibility contracts)
        working-directory: store/sqldb
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: store/sqldb
        run: go vet ./...

  test-sqldb-real:
    name: Test (store/sqldb real, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            image: postgres:17-alpine
            driver: pgx
            port: 5432
            ssl_mode: disable
            health_cmd: pg_isready -h 127.0.0.1 -U credo -d credo_test
          - database: MySQL
            image: mysql:8.4
            driver: mysql
            port: 3306
            ssl_mode: "false"
            health_cmd: mysqladmin ping -h 127.0.0.1 -ucredo -pcredo --silent

    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: credo
          POSTGRES_PASSWORD: credo
          POSTGRES_DB: credo_test
          MYSQL_ROOT_PASSWORD: credo-root
          MYSQL_DATABASE: credo_test
          MYSQL_USER: credo
          MYSQL_PASSWORD: credo
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: >-
          --health-cmd "${{ matrix.health_cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create in-tree module workspace
        run: go run ./scripts/releasegate workspace

      - name: Run real database contract tests
        working-directory: store/sqldb
        run: go test -count=1 -timeout=2m -run '^TestRealDB_Contracts$' -v .
        env:
          CREDO_REAL_DB_TEST: "1"
          CREDO_REAL_DB_DRIVER: ${{ matrix.driver }}
          CREDO_REAL_DB_HOST: 127.0.0.1
          CREDO_REAL_DB_PORT: ${{ matrix.port }}
          CREDO_REAL_DB_NAME: credo_test
          CREDO_REAL_DB_USER: credo
          CREDO_REAL_DB_PASSWORD: credo
          CREDO_REAL_DB_SSL_MODE: ${{ matrix.ssl_mode }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build (root)
        run: go build ./...

      - name: Create in-tree module workspace
        run: go run ./scripts/releasegate workspace

      - name: Build (store/sqldb)
        working-directory: store/sqldb
        run: go build ./...

  release-gate:
    name: Release gate (replace-free consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build external store/sqldb consumer
        run: go run ./scripts/releasegate candidate

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go mod tidy (root)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go mod tidy (store/sqldb)
        run: |
          go run ./scripts/releasegate tidy
          git diff --exit-code -- store/sqldb/go.mod store/sqldb/go.sum

  examples:
    name: Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: examples/saas
            smoke_url: http://127.0.0.1:8080/health
          - module: examples/hello
            smoke_url: http://127.0.0.1:8080/
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Each example is its own module (replace github.com/credo-go/credo => ../..),
      # so it exercises the framework's generic-method call sites across a module
      # boundary — the gate that would break first on a Go 1.27 migration slip.
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Building an example proves it compiles, not that it runs: the saas
      # example spent releases unable to start because it read a config key its
      # own file did not define, and build+vet stayed green throughout. Start
      # it, serve one request, and shut it down.
      - name: Smoke
        working-directory: ${{ matrix.module }}
        env:
          URL: ${{ matrix.smoke_url }}
        run: |
          set -euo pipefail

          BIN="$RUNNER_TEMP/example"
          go build -o "$BIN" .

          # The example reads its config from the working directory, so run the
          # binary from here rather than from where it was built.
          "$BIN" &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          # Poll rather than sleep a fixed amount: startup does config
          # discovery, DI finalisation, and a port bind. A process that dies
          # during any of those is the failure this step exists to catch, so
          # check liveness every iteration and surface its exit status instead
          # of waiting out the whole timeout.
          ready=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the example exited during startup"
              trap - EXIT
              wait "$PID" || true
              exit 1
            fi
            if curl -fsS -o /dev/null --max-time 2 "$URL"; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ -z "$ready" ]; then
            echo "::error::$URL never answered within 30s"
            exit 1
          fi
          echo "$URL answered 200"

          # SIGTERM is what a container runtime sends. Run blocks until it
          # arrives, then drains and returns nil, so a non-zero exit here means
          # the shutdown path broke.
          trap - EXIT
          kill -TERM "$PID"
          if wait "$PID"; then
            echo "graceful shutdown returned 0"
          else
            echo "::error::graceful shutdown exited $?"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # v2.12.2 pins x/tools v0.44.0, whose package loader cannot read Go 1.27
      # generic-method export data. Build the exact linter release with the
      # reviewed x/tools v0.48.0 override until a tagged golangci-lint includes
      # that support. Run required lint serially for both repository modules;
      # the full-canary job remains non-blocking for incompatible SSA engines.
      - name: Build pinned golangci-lint
        run: |
          tool_dir="$RUNNER_TEMP/golangci-lint-build"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          go mod init credo.tools/golangci-lint
          go get \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} \
            golang.org/x/tools@${GOLANGCI_X_TOOLS_VERSION}
          go build -o "$RUNNER_TEMP/golangci-lint" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Run golangci-lint (root)
        run: >-
          "$RUNNER_TEMP/golangci-lint" run --concurrency=1 ./...

      - name: Create in-tree module workspace
        run: go run ./scripts/releasegate workspace

      - name: Run golangci-lint (store/sqldb)
        working-directory: store/sqldb
        run: >-
          "$RUNNER_TEMP/golangci-lint" run --concurrency=1 ./...

  lint-full-canary:
    name: Lint (full, canary)
    runs-on: ubuntu-latest

    # Non-blocking early-warning job: runs the linters the required Lint job
    # disables on the Go 1.27 RC (staticcheck, unused, gosec — their SSA/IR
    # engines currently panic; see .golangci.yml). It must NOT be a required
    # check in branch protection. When this turns green, the upstream tooling
    # supports 1.27: restore the three linters to the required job and delete
    # this canary.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build pinned golangci-lint
        run: |
          tool_dir="$RUNNER_TEMP/golangci-lint-build"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          go mod init credo.tools/golangci-lint
          go get \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} \
            golang.org/x/tools@${GOLANGCI_X_TOOLS_VERSION}
          go build -o "$RUNNER_TEMP/golangci-lint" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Run golangci-lint (full)
        run: >-
          $RUNNER_TEMP/golangci-lint run ./...
          --enable=staticcheck --enable=unused --enable=gosec
