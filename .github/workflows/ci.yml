name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Go 1.27 is pre-GA: actions/setup-go cannot resolve the `toolchain go1.27rc2`
# directive in go.mod (the bare `1.27rc2` spec is not valid semver, so both the
# manifest lookup and the direct download fail). Pin the release candidate with
# the semver-prerelease form setup-go accepts; it maps to the go1.27rc2 build.
# Once 1.27 GA ships and go.mod drops the rc toolchain line, the setup-go steps
# can return to `go-version-file: go.mod`.
env:
  GO_VERSION: "1.27.0-rc.2"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOLANGCI_X_TOOLS_VERSION: "v0.48.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  test-sqldb:
    name: Test (store/sqldb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run submodule tests
        working-directory: store/sqldb
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: store/sqldb
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go mod tidy (root)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go mod tidy (store/sqldb)
        working-directory: store/sqldb
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  examples:
    name: Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [examples/saas, examples/hello]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Each example is its own module (replace github.com/credo-go/credo => ../..),
      # so it exercises the framework's generic-method call sites across a module
      # boundary — the gate that would break first on a Go 1.27 migration slip.
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # v2.12.2 pins x/tools v0.44.0, whose package loader cannot read Go 1.27
      # generic-method export data. Build the exact linter release with only
      # x/tools raised to the first locally verified compatible release. Remove
      # this shim when a tagged golangci-lint includes that support.
      - name: Build pinned golangci-lint
        run: |
          tool_dir="$RUNNER_TEMP/golangci-lint-build"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          go mod init credo.tools/golangci-lint
          go get \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} \
            golang.org/x/tools@${GOLANGCI_X_TOOLS_VERSION}
          go build -o "$RUNNER_TEMP/golangci-lint" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Run golangci-lint
        run: "$RUNNER_TEMP/golangci-lint run ./..."

  lint-full-canary:
    name: Lint (full, canary)
    runs-on: ubuntu-latest

    # Non-blocking early-warning job: runs the linters the required Lint job
    # disables on the Go 1.27 RC (staticcheck, unused, gosec — their SSA/IR
    # engines currently panic; see .golangci.yml). It must NOT be a required
    # check in branch protection. When this turns green, the upstream tooling
    # supports 1.27: restore the three linters to the required job and delete
    # this canary.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build pinned golangci-lint
        run: |
          tool_dir="$RUNNER_TEMP/golangci-lint-build"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          go mod init credo.tools/golangci-lint
          go get \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} \
            golang.org/x/tools@${GOLANGCI_X_TOOLS_VERSION}
          go build -o "$RUNNER_TEMP/golangci-lint" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Run golangci-lint (full)
        run: >-
          $RUNNER_TEMP/golangci-lint run ./...
          --enable=staticcheck --enable=unused --enable=gosec
