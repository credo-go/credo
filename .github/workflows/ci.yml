name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Go 1.27 is pre-GA: actions/setup-go cannot resolve the `toolchain go1.27rc1`
# directive in go.mod (the bare `1.27rc1` spec is not valid semver, so both the
# manifest lookup and the direct download fail). Pin the release candidate with
# the semver-prerelease form setup-go accepts; it maps to the go1.27rc1 build.
# Once 1.27 GA ships and go.mod drops the rc toolchain line, the setup-go steps
# can return to `go-version-file: go.mod`.
env:
  GO_VERSION: "1.27.0-rc.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  test-sqldb:
    name: Test (store/sqldb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run submodule tests (including Bun compatibility contracts)
        working-directory: store/sqldb
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: store/sqldb
        run: go vet ./...

  test-sqldb-real:
    name: Test (store/sqldb real, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            image: postgres:17-alpine
            driver: pgx
            port: 5432
            ssl_mode: disable
            health_cmd: pg_isready -h 127.0.0.1 -U credo -d credo_test
          - database: MySQL
            image: mysql:8.4
            driver: mysql
            port: 3306
            ssl_mode: "false"
            health_cmd: mysqladmin ping -h 127.0.0.1 -ucredo -pcredo --silent

    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: credo
          POSTGRES_PASSWORD: credo
          POSTGRES_DB: credo_test
          MYSQL_ROOT_PASSWORD: credo-root
          MYSQL_DATABASE: credo_test
          MYSQL_USER: credo
          MYSQL_PASSWORD: credo
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: >-
          --health-cmd "${{ matrix.health_cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run real database contract tests
        working-directory: store/sqldb
        run: go test -count=1 -timeout=2m -run '^TestRealDB_Contracts$' -v .
        env:
          CREDO_REAL_DB_TEST: "1"
          CREDO_REAL_DB_DRIVER: ${{ matrix.driver }}
          CREDO_REAL_DB_HOST: 127.0.0.1
          CREDO_REAL_DB_PORT: ${{ matrix.port }}
          CREDO_REAL_DB_NAME: credo_test
          CREDO_REAL_DB_USER: credo
          CREDO_REAL_DB_PASSWORD: credo
          CREDO_REAL_DB_SSL_MODE: ${{ matrix.ssl_mode }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (root)
        run: go build ./...

      - name: Build (store/sqldb)
        working-directory: store/sqldb
        run: go build ./...

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go mod tidy (root)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go mod tidy (store/sqldb)
        working-directory: store/sqldb
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  examples:
    name: Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [examples/saas, examples/hello]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Each example is its own module (replace github.com/credo-go/credo => ../..),
      # so it exercises the framework's generic-method call sites across a module
      # boundary — the gate that would break first on a Go 1.27 migration slip.
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The latest release (v2.12.2) embeds x/tools v0.44.0, which races or
      # corrupts Go 1.27 generic-method export imports. Pin the reviewed
      # upstream x/tools v0.47.0 bump until golangci-lint releases supported
      # Go 1.27 tooling, and keep required lint serial as an extra guard.
      # The action cache key omits the lint version, so bypass it while pinned
      # to avoid restoring analysis data written by v2.12.2/x-tools v0.44.0.
      # The full-canary job remains non-blocking for incompatible SSA linters.
      - name: Run golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: "87b977018c69c97519b000085daa8ce693e8ed22"
          install-mode: goinstall
          args: --concurrency=1
          skip-cache: true

      - name: Run golangci-lint (store/sqldb)
        uses: golangci/golangci-lint-action@v9
        with:
          version: "87b977018c69c97519b000085daa8ce693e8ed22"
          install-mode: goinstall
          args: --concurrency=1
          skip-cache: true
          working-directory: store/sqldb

  lint-full-canary:
    name: Lint (full, canary)
    runs-on: ubuntu-latest

    # Non-blocking early-warning job: runs the linters the required Lint job
    # disables on the Go 1.27 RC (staticcheck, unused, gosec — their SSA/IR
    # engines currently panic; see .golangci.yml). It must NOT be a required
    # check in branch protection. When this turns green, the upstream tooling
    # supports 1.27: restore the three linters to the required job and delete
    # this canary.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint (full)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --enable=staticcheck --enable=unused --enable=gosec
