version: "2"

run:
  go: "1.27"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - unconvert
    - whitespace
    # staticcheck, unused, and gosec are temporarily disabled on the Go 1.27
    # release candidate: their SSA/IR analysis engines panic while building IR.
    # staticcheck and unused share honnef.co/go/tools v0.7.0's IR builder
    # ("buildir: unexpected expr: *ast.KeyValueExpr" on internal/poll); gosec's
    # SSA taint analysis panics ("panic: T") in its callgraph builder. Required
    # CI rebuilds golangci-lint v2.12.2 with x/tools v0.48.0 to repair the
    # frontend/package-loader incompatibility, but that override cannot patch
    # these separate engines. The framework is clean under `go vet` on
    # go1.27rc2, and lint-full-canary keeps running all three non-blockingly.
    # Re-enable them here and remove the canary once upstream supports Go 1.27.
    # - staticcheck
    # - unused
    # - gosec
  settings:
    gosec:
      excludes:
        - G104
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/credo-go/credo
  exclusions:
    generated: lax
