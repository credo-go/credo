# Comprehensive Credo configuration for a SaaS application.
#
# Section categories:
#   [framework-read]  Automatically consumed by credo.New()
#   [user-read]       Read via rawCfg.Unmarshal("key", &cfg) at module boundary, injected via DI
#
# Complete copyable configuration references live in ../references/config.
#
# Precedence (lowest to highest):
#   1. This file (config.yaml)
#   2. .env file
#   3. Process environment variables (CREDO_ prefix)
#   4. Programmatic With* options passed to credo.New()
#
# Discovery looks for config.json, then config.yaml, then config.yml, and merges
# every file it finds. This example ships YAML only, so there is one source of
# truth; the hello example ships JSON. Keep one format per application unless a
# layered merge is what you want.

# ---------------------------------------------------------------------------
# Server [framework-read]
# Automatically consumed by credo.New(credo.WithRawConfig(rawCfg)).
# The "server" key is the ONLY section read by the framework itself.
# ---------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  read_header_timeout: "5s"
  max_header_bytes: 1048576            # 1 MB (Go default when 0)
  max_header_value_count: 500          # Header lines per request (Go default when 0).
                                       # Over the limit: 431, written straight to the
                                       # connection by net/http and never logged.
  shutdown_timeout: "15s"              # Drain budget on SIGINT/SIGTERM (30s when 0).
                                       # main.go also passes WithShutdownTimeout: a
                                       # programmatic option always wins over its key.
  reload_timeout: "30s"                # Budget for a SIGHUP-triggered app.Reload
  strict_bodies: false                 # true: BindBody rejects unknown JSON members (400)
  # trusted_proxies:                   # CIDRs allowed to set X-Forwarded-* (empty = none)
  #   - "10.0.0.0/8"
  # tls:                               # Serving HTTPS requires BOTH paths; the pair is
  #   cert_file: "/etc/ssl/app.pem"    # re-read on every reload, rotating the certificate
  #   key_file: "/etc/ssl/app.key"     # without dropping open connections.

# ---------------------------------------------------------------------------
# Databases [user-read]
# Named database connections using sqldb.Config (store/sqldb package).
# Each entry is unmarshalled into sqldb.Config and registered via store.Register.
# Usage:  rawCfg.Unmarshal("databases.default", &cfg)
# ---------------------------------------------------------------------------
databases:
  default:
    driver: "postgres"
    host: "localhost"
    port: 5432
    name: "saas_app"
    user: "app_user"
    password: ""                       # Override via CREDO_DATABASES__DEFAULT__PASSWORD
    max_open: 25
    max_idle: 5
    max_lifetime: "30m"
    ssl_mode: "require"
  # read_replica:
  #   driver: "postgres"
  #   host: "replica-db.internal"
  #   port: 5432
  #   name: "saas_app"
  #   user: "readonly_user"
  #   password: ""
  #   max_open: 10
  #   max_idle: 2
  #   max_lifetime: "30m"
  #   ssl_mode: "require"

# ---------------------------------------------------------------------------
# Application [user-read]
# User-defined application settings, injected via DI.
# Usage:  rawCfg.Unmarshal("app", &cfg)
# ---------------------------------------------------------------------------
app:
  name: "My SaaS App"
  environment: "production"
  debug: false
