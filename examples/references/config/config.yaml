# Credo configuration reference (YAML).
# Keep this file semantically aligned with config.json.

server:
  host: "127.0.0.1"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  read_header_timeout: "5s"
  shutdown_timeout: "30s"
  reload_timeout: "30s"
  max_header_bytes: 1048576
  max_header_value_count: 500
  max_body_bytes: 4194304
  redirect_trailing_slash: true
  debug: false
  strict_bodies: false
  trusted_proxies: []
  tls:
    cert_file: ""
    key_file: ""

i18n:
  dir: "locales/"
  default: "en"

# Application-owned typed snapshots. Credo does not open these databases or
# consume the app section automatically.
databases:
  default:
    driver: "postgres"
    host: "localhost"
    port: 5432
    name: "credo_app"
    user: "credo_app"
    password: ""
    connect_timeout: "5s"
    max_open: 25
    max_idle: 5
    max_idle_time: "5m"
    max_lifetime: "30m"
    ssl_mode: "require"
    options: {}

app:
  name: "Credo App"
  environment: "development"
  debug: false
